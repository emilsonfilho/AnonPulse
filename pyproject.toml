[project]
name = "anonpulse"
version = "0.1.0"
description = "Plataforma desenvolvida para gerenciar feedbacks anônimos de alunos para monitores da UFC Quixadá."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beanie>=2.1.0",
    "faker>=40.12.0",
    "fastapi-pagination>=0.15.12",
    "fastapi[standard]>=0.136.1",
    "pymongo>=4.17.0",
    "ruff>=0.15.12",
    "uvicorn>=0.46.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
]
